name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: mkdir -p www assets && cp index.html www/index.html && cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/filesystem @capacitor/share @capacitor-community/text-to-speech
      - run: npm install --legacy-peer-deps -D @capacitor/assets
      - run: npx cap add android && npx capacitor-assets generate --android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: Kaizen30-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
